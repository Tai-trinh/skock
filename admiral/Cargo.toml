[package]
name = "admiral"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "skock-admiral"
path = "src/main.rs"

[dependencies]
types = { path = "../types" }
catalog = { path = "../catalog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_xoshiro = "0.6"
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1"
