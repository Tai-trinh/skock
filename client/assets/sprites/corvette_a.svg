<?xml version="1.0" encoding="UTF-8"?>
<!--
  CORVETTE CLASS — "Type-A" patrol hull
  Top-down orthographic, nose pointing toward -Y (up in screen space).
  Style: 80-90s anime mecha (Macross / Gall Force lineage)
  Palette: warm beige structural plating, mecha-blue tech/weapon systems
  Canvas: 256 × 320 px  ·  Ship occupies ~220 × 300 of that area
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 320" width="256" height="320">
<defs>

  <!-- ── Hull gradients (lit from upper-left / bow) ── -->
  <linearGradient id="gHull" x1="0.2" y1="0" x2="0.9" y2="1">
    <stop offset="0"   stop-color="#EEE2CA"/>
    <stop offset="0.5" stop-color="#D8C9A6"/>
    <stop offset="1"   stop-color="#B09068"/>
  </linearGradient>

  <linearGradient id="gHullBow" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0"   stop-color="#D8C9A8"/>
    <stop offset="1"   stop-color="#F2EAD6"/>
  </linearGradient>

  <linearGradient id="gSideL" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0"   stop-color="#C4B292"/>
    <stop offset="1"   stop-color="#907458"/>
  </linearGradient>

  <linearGradient id="gSideR" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#C4B292"/>
    <stop offset="1"   stop-color="#907458"/>
  </linearGradient>

  <!-- ── Wing gradients ── -->
  <linearGradient id="gWingL" x1="1" y1="0.4" x2="0" y2="0.6">
    <stop offset="0"   stop-color="#D2C09A"/>
    <stop offset="0.6" stop-color="#B8A07A"/>
    <stop offset="1"   stop-color="#806050"/>
  </linearGradient>

  <linearGradient id="gWingR" x1="0" y1="0.4" x2="1" y2="0.6">
    <stop offset="0"   stop-color="#D2C09A"/>
    <stop offset="0.6" stop-color="#B8A07A"/>
    <stop offset="1"   stop-color="#806050"/>
  </linearGradient>

  <!-- ── Blue tech / weapon / engine gradients ── -->
  <linearGradient id="gBlue" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0"   stop-color="#4E90CC"/>
    <stop offset="1"   stop-color="#163A64"/>
  </linearGradient>

  <linearGradient id="gBlueDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#1C3C62"/>
    <stop offset="1"   stop-color="#0C1E38"/>
  </linearGradient>

  <linearGradient id="gEngine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#162E50"/>
    <stop offset="0.45" stop-color="#2A5A8C"/>
    <stop offset="1"   stop-color="#5AAAD8"/>
  </linearGradient>

  <!-- ── Cockpit ── -->
  <linearGradient id="gCockpit" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0"   stop-color="#96CCF2"/>
    <stop offset="0.4" stop-color="#4A88BE"/>
    <stop offset="1"   stop-color="#162A48"/>
  </linearGradient>

  <!-- ── Engine thruster glow ── -->
  <radialGradient id="gThruster" cx="50%" cy="35%" r="65%">
    <stop offset="0"   stop-color="#D8F0FF"/>
    <stop offset="0.3" stop-color="#78C8F0"/>
    <stop offset="0.7" stop-color="#3880C8"/>
    <stop offset="1"   stop-color="#163060"/>
  </radialGradient>

</defs>

<!-- ═══════════════════════════════════════════════════
     RENDER ORDER (painter's algorithm, back → front)
     1. Wings
     2. Engine nacelles
     3. Main hull body
     4. Hull panels & surface detail
     5. Blue tech panels
     6. Weapons
     7. Cockpit / sensors
     8. Markings
     ═══════════════════════════════════════════════════ -->
<g stroke-linejoin="round" stroke-linecap="round">

<!-- ──────────────────────────────────────────────────
     1. WINGS  (behind hull, sweep back from mid-ship)
     ────────────────────────────────────────────────── -->

<!-- Left wing — main surface
     Root leading (86,145) → tip leading (24,150) → tip (16,164)
     → tip trailing (24,178) → inner fold (56,192) → root trailing (88,192) -->
<polygon
  points="86,145 24,150 16,164 24,178 56,192 88,192"
  fill="url(#gWingL)" stroke="#1A2535" stroke-width="1.9"/>

<!-- Left wing — blue tech stripe (inboard 2/3) -->
<polygon
  points="80,148 38,155 34,168 40,180 60,188 84,188"
  fill="url(#gBlue)" stroke="#1A2535" stroke-width="1.1" opacity="0.92"/>

<!-- Left wing — outer beige tip cap -->
<polygon
  points="24,150 16,164 24,178 36,172 38,158"
  fill="#C0A880" stroke="#1A2535" stroke-width="1"/>

<!-- Left wing — panel division lines -->
<line x1="50" y1="152" x2="42" y2="190" stroke="#243050" stroke-width="0.9"/>
<line x1="86" y1="169" x2="34" y2="178" stroke="#243050" stroke-width="0.9"/>

<!-- Left wing — small mid-wing gun turret -->
<ellipse cx="52" cy="170" rx="5.5" ry="4"
  fill="url(#gBlueDark)" stroke="#1A2535" stroke-width="1.1"/>
<rect x="49" y="162" width="6" height="9" rx="1.2"
  fill="#0E1C30" stroke="#1A2535" stroke-width="0.8"/>

<!-- Right wing — main surface (mirrored) -->
<polygon
  points="170,145 232,150 240,164 232,178 200,192 168,192"
  fill="url(#gWingR)" stroke="#1A2535" stroke-width="1.9"/>

<!-- Right wing — blue tech stripe -->
<polygon
  points="176,148 218,155 222,168 216,180 196,188 172,188"
  fill="url(#gBlue)" stroke="#1A2535" stroke-width="1.1" opacity="0.92"/>

<!-- Right wing — outer beige tip cap -->
<polygon
  points="232,150 240,164 232,178 220,172 218,158"
  fill="#C0A880" stroke="#1A2535" stroke-width="1"/>

<!-- Right wing — panel division lines -->
<line x1="206" y1="152" x2="214" y2="190" stroke="#243050" stroke-width="0.9"/>
<line x1="170" y1="169" x2="222" y2="178" stroke="#243050" stroke-width="0.9"/>

<!-- Right wing — small mid-wing gun turret -->
<ellipse cx="204" cy="170" rx="5.5" ry="4"
  fill="url(#gBlueDark)" stroke="#1A2535" stroke-width="1.1"/>
<rect x="201" y="162" width="6" height="9" rx="1.2"
  fill="#0E1C30" stroke="#1A2535" stroke-width="0.8"/>

<!-- ──────────────────────────────────────────────────
     2. ENGINE NACELLES  (behind hull at stern)
     ────────────────────────────────────────────────── -->

<!-- Left nacelle body
     Shape: tapered pod, wide at attachment, narrowing to thruster mouth -->
<polygon
  points="80,232 94,232 100,244 100,288 87,297 74,288 76,244"
  fill="url(#gEngine)" stroke="#1A2535" stroke-width="1.9"/>

<!-- Left nacelle — intake collar (top) -->
<ellipse cx="87" cy="236" rx="9" ry="4.5"
  fill="#0E2038" stroke="#1A2535" stroke-width="1.2"/>

<!-- Left nacelle — vent slats -->
<rect x="77" y="252" width="20" height="3"   rx="0.7" fill="#265882" stroke="#1A2535" stroke-width="0.6"/>
<rect x="77" y="259" width="20" height="3"   rx="0.7" fill="#265882" stroke="#1A2535" stroke-width="0.6"/>
<rect x="77" y="266" width="20" height="3"   rx="0.7" fill="#265882" stroke="#1A2535" stroke-width="0.6"/>
<rect x="77" y="273" width="20" height="3"   rx="0.7" fill="#265882" stroke="#1A2535" stroke-width="0.6"/>

<!-- Left nacelle — thruster mouth -->
<ellipse cx="87" cy="292" rx="11" ry="5.5"
  fill="url(#gThruster)" stroke="#1A2535" stroke-width="1.3"/>

<!-- Right nacelle body -->
<polygon
  points="176,232 162,232 156,244 156,288 169,297 182,288 180,244"
  fill="url(#gEngine)" stroke="#1A2535" stroke-width="1.9"/>

<!-- Right nacelle — intake collar -->
<ellipse cx="169" cy="236" rx="9" ry="4.5"
  fill="#0E2038" stroke="#1A2535" stroke-width="1.2"/>

<!-- Right nacelle — vent slats -->
<rect x="159" y="252" width="20" height="3" rx="0.7" fill="#265882" stroke="#1A2535" stroke-width="0.6"/>
<rect x="159" y="259" width="20" height="3" rx="0.7" fill="#265882" stroke="#1A2535" stroke-width="0.6"/>
<rect x="159" y="266" width="20" height="3" rx="0.7" fill="#265882" stroke="#1A2535" stroke-width="0.6"/>
<rect x="159" y="273" width="20" height="3" rx="0.7" fill="#265882" stroke="#1A2535" stroke-width="0.6"/>

<!-- Right nacelle — thruster mouth -->
<ellipse cx="169" cy="292" rx="11" ry="5.5"
  fill="url(#gThruster)" stroke="#1A2535" stroke-width="1.3"/>

<!-- ──────────────────────────────────────────────────
     3. MAIN HULL BODY
     Centre spine at x=128, nose at y=14, tail-tip at y=285
     ────────────────────────────────────────────────── -->

<polygon id="hull"
  points="128,14  108,46  92,86  85,143  87,192
          96,236  112,270  128,285  144,270  160,236
          169,192  171,143  164,86  148,46  128,14"
  fill="url(#gHull)" stroke="#1A2535" stroke-width="2.3"/>

<!-- ──────────────────────────────────────────────────
     4. HULL SURFACE PANELS & STRUCTURAL LINES
     ────────────────────────────────────────────────── -->

<!-- Nose cap (brighter lit section) -->
<polygon
  points="128,14 110,44 120,50 128,53 136,50 146,44"
  fill="#F2EAD8" stroke="none"/>

<!-- Left shoulder bevel -->
<polygon
  points="110,44  92,86  98,90  106,84  116,48"
  fill="#E8DCC2" stroke="none" opacity="0.7"/>

<!-- Right shoulder bevel -->
<polygon
  points="146,44  164,86  158,90  150,84  140,48"
  fill="#E8DCC2" stroke="none" opacity="0.7"/>

<!-- Left mid-hull side panel (angled armor face) -->
<polygon
  points="92,86  85,143  91,147  98,141  100,88  96,86"
  fill="url(#gSideL)" stroke="#283848" stroke-width="0.9"/>

<!-- Left aft-hull side panel -->
<polygon
  points="87,194  96,236  102,234  106,192  94,192"
  fill="url(#gSideL)" stroke="#283848" stroke-width="0.9"/>

<!-- Right mid-hull side panel -->
<polygon
  points="164,86  171,143  165,147  158,141  156,88  160,86"
  fill="url(#gSideR)" stroke="#283848" stroke-width="0.9"/>

<!-- Right aft-hull side panel -->
<polygon
  points="169,194  160,236  154,234  150,192  162,192"
  fill="url(#gSideR)" stroke="#283848" stroke-width="0.9"/>

<!-- Structural cross-section lines (horizontal seams) -->
<line x1="110" y1="44"  x2="146" y2="44"  stroke="#283848" stroke-width="1.4"/>
<line x1="92"  y1="86"  x2="164" y2="86"  stroke="#283848" stroke-width="1.3"/>
<line x1="85"  y1="143" x2="171" y2="143" stroke="#283848" stroke-width="1.2"/>
<line x1="87"  y1="192" x2="169" y2="192" stroke="#283848" stroke-width="1.2"/>
<line x1="96"  y1="236" x2="160" y2="236" stroke="#283848" stroke-width="1.1"/>
<line x1="112" y1="270" x2="144" y2="270" stroke="#283848" stroke-width="1.0"/>

<!-- Center spine -->
<line x1="128" y1="18"  x2="128" y2="280" stroke="#283848" stroke-width="0.9" opacity="0.55"/>

<!-- Sub-panel lines (left) -->
<line x1="118" y1="46"  x2="110" y2="86"  stroke="#283848" stroke-width="0.7" opacity="0.55"/>
<line x1="110" y1="86"  x2="103" y2="143" stroke="#283848" stroke-width="0.7" opacity="0.55"/>
<line x1="103" y1="143" x2="105" y2="192" stroke="#283848" stroke-width="0.7" opacity="0.55"/>
<line x1="105" y1="192" x2="108" y2="236" stroke="#283848" stroke-width="0.7" opacity="0.55"/>
<line x1="108" y1="236" x2="114" y2="268" stroke="#283848" stroke-width="0.7" opacity="0.55"/>

<!-- Sub-panel lines (right) -->
<line x1="138" y1="46"  x2="146" y2="86"  stroke="#283848" stroke-width="0.7" opacity="0.55"/>
<line x1="146" y1="86"  x2="153" y2="143" stroke="#283848" stroke-width="0.7" opacity="0.55"/>
<line x1="153" y1="143" x2="151" y2="192" stroke="#283848" stroke-width="0.7" opacity="0.55"/>
<line x1="151" y1="192" x2="148" y2="236" stroke="#283848" stroke-width="0.7" opacity="0.55"/>
<line x1="148" y1="236" x2="142" y2="268" stroke="#283848" stroke-width="0.7" opacity="0.55"/>

<!-- Left side detail bevel marks -->
<polygon points="92,100 97,96 101,104 96,108" fill="#D4C2A0" stroke="#283848" stroke-width="0.7"/>
<polygon points="89,155 95,151 98,159 92,163" fill="#D4C2A0" stroke="#283848" stroke-width="0.7"/>

<!-- Right side detail bevel marks -->
<polygon points="164,100 159,96 155,104 160,108" fill="#D4C2A0" stroke="#283848" stroke-width="0.7"/>
<polygon points="167,155 161,151 158,159 164,163" fill="#D4C2A0" stroke="#283848" stroke-width="0.7"/>

<!-- Tail fin detail -->
<polygon
  points="112,270 128,285 144,270 137,264 128,267 119,264"
  fill="#D8C8A8" stroke="#1A2535" stroke-width="1.3"/>
<line x1="128" y1="267" x2="128" y2="283" stroke="#283848" stroke-width="0.9"/>

<!-- ──────────────────────────────────────────────────
     5. BLUE TECH PANELS
     ────────────────────────────────────────────────── -->

<!-- Forward bridge / sensor housing (distinctive blue section at nose) -->
<polygon
  points="116,46  128,42  140,46  144,84  128,88  112,84"
  fill="url(#gBlue)" stroke="#1A2535" stroke-width="1.4"/>

<!-- Bridge internal divider -->
<line x1="116" y1="63" x2="140" y2="63" stroke="#183252" stroke-width="1.1"/>

<!-- Aft engineering panel (engine management deck) -->
<polygon
  points="100,194  128,190  156,194  158,232  128,236  98,232"
  fill="url(#gBlue)" stroke="#1A2535" stroke-width="1.4"/>

<!-- Aft panel internal grid -->
<line x1="114" y1="192" x2="112" y2="234" stroke="#183252" stroke-width="1.0"/>
<line x1="128" y1="190" x2="128" y2="236" stroke="#183252" stroke-width="1.0"/>
<line x1="142" y1="192" x2="144" y2="234" stroke="#183252" stroke-width="1.0"/>
<line x1="100" y1="212" x2="156" y2="212" stroke="#183252" stroke-width="1.0"/>

<!-- Nacelle strut connectors (beige collar bridging hull→nacelle) -->
<polygon points="91,233  81,235  78,243  90,245  102,243  105,235  97,233"
  fill="#D0C0A0" stroke="#1A2535" stroke-width="1.2"/>
<polygon points="165,233  175,235  178,243  166,245  154,243  151,235  159,233"
  fill="#D0C0A0" stroke="#1A2535" stroke-width="1.2"/>

<!-- ──────────────────────────────────────────────────
     6. WEAPON SYSTEMS
     ────────────────────────────────────────────────── -->

<!-- Left forward twin-cannon mount -->
<polygon points="79,75  93,71  95,85  84,88  79,82"
  fill="url(#gBlueDark)" stroke="#1A2535" stroke-width="1.3"/>
<!-- Left gun tubes -->
<rect x="73" y="54"  width="5.5" height="20" rx="1.8"
  fill="#0C1826" stroke="#1A2535" stroke-width="0.9"/>
<rect x="80" y="54"  width="5.5" height="20" rx="1.8"
  fill="#0C1826" stroke="#1A2535" stroke-width="0.9"/>
<!-- Left muzzle flash guard dots -->
<circle cx="75.5" cy="54" r="2" fill="#2A5888" stroke="none"/>
<circle cx="82.5" cy="54" r="2" fill="#2A5888" stroke="none"/>

<!-- Right forward twin-cannon mount (mirrored) -->
<polygon points="177,75  163,71  161,85  172,88  177,82"
  fill="url(#gBlueDark)" stroke="#1A2535" stroke-width="1.3"/>
<!-- Right gun tubes -->
<rect x="177.5" y="54" width="5.5" height="20" rx="1.8"
  fill="#0C1826" stroke="#1A2535" stroke-width="0.9"/>
<rect x="170.5" y="54" width="5.5" height="20" rx="1.8"
  fill="#0C1826" stroke="#1A2535" stroke-width="0.9"/>
<!-- Right muzzle flash guard dots -->
<circle cx="180.5" cy="54" r="2" fill="#2A5888" stroke="none"/>
<circle cx="173.5" cy="54" r="2" fill="#2A5888" stroke="none"/>

<!-- ──────────────────────────────────────────────────
     7. COCKPIT / SENSORS
     ────────────────────────────────────────────────── -->

<!-- Bridge dome -->
<ellipse cx="128" cy="70" rx="14" ry="10"
  fill="url(#gCockpit)" stroke="#1A2535" stroke-width="1.6"/>

<!-- Anime-style glint highlights (two-tone, classic 80s look) -->
<ellipse cx="121" cy="65" rx="5.5" ry="4"   fill="#C8E8FF" opacity="0.78"/>
<ellipse cx="133" cy="68" rx="3"   ry="2.5" fill="#E8F6FF" opacity="0.52"/>

<!-- Central thruster at tail (hull axis) -->
<ellipse cx="128" cy="282" rx="8" ry="4.5"
  fill="url(#gThruster)" stroke="#1A2535" stroke-width="1.1"/>

<!-- ──────────────────────────────────────────────────
     8. MARKINGS
     ────────────────────────────────────────────────── -->

<!-- Nose sensor spike -->
<polygon points="125,14 128,4 131,14 128,17"
  fill="#2A5890" stroke="#1A2535" stroke-width="1.2"/>

<!-- Port antenna -->
<line x1="110" y1="44" x2="100" y2="32" stroke="#1A2535" stroke-width="1.5"/>
<circle cx="100" cy="32" r="2.3" fill="#4A8ACE" stroke="#1A2535" stroke-width="0.9"/>

<!-- Starboard antenna -->
<line x1="146" y1="44" x2="156" y2="32" stroke="#1A2535" stroke-width="1.5"/>
<circle cx="156" cy="32" r="2.3" fill="#4A8ACE" stroke="#1A2535" stroke-width="0.9"/>

<!-- Hull classification banding (port) -->
<rect x="87" y="108" width="14" height="2.5" rx="0.6" fill="#1A2535" opacity="0.58"/>
<rect x="87" y="113" width="9"  height="2"   rx="0.6" fill="#1A2535" opacity="0.38"/>

<!-- Hull classification banding (starboard) -->
<rect x="155" y="108" width="14" height="2.5" rx="0.6" fill="#1A2535" opacity="0.58"/>
<rect x="160" y="113" width="9"  height="2"   rx="0.6" fill="#1A2535" opacity="0.38"/>

<!-- Tactical insignia — hexagonal regiment mark (centre hull) -->
<g transform="translate(128,120)">
  <!-- Outer hex ring -->
  <polygon
    points="0,-13  11.3,-6.5  11.3,6.5  0,13  -11.3,6.5  -11.3,-6.5"
    fill="none" stroke="#1A2535" stroke-width="1.7"/>
  <!-- Inner hex fill (very dark, ghost) -->
  <polygon
    points="0,-8  6.9,-4  6.9,4  0,8  -6.9,4  -6.9,-4"
    fill="#1A2535" opacity="0.18"/>
  <!-- Forward-pointing chevron -->
  <polygon points="0,-8  5.5,2  0,5.5  -5.5,2"
    fill="#1A2535" opacity="0.85"/>
</g>

</g>
</svg>
