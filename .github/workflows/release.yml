name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build sim (release)
        run: cargo build --release -p sim

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.4.1"
          use-dotnet: true
          include-templates: true

      - name: Export client (Windows)
        run: |
          mkdir -p client/build
          godot --headless --path client --export-release "Windows Desktop" build/skock.exe
        shell: bash

      - name: Package release
        run: |
          mkdir -p dist
          cp -r client/build/. dist/
          cp target/release/skock-sim.exe dist/
          cp -r client/data dist/data
        shell: bash

      - name: Zip
        run: Compress-Archive -Path dist\* -DestinationPath skock-windows.zip
        shell: pwsh

      - name: Upload dev release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dev build"
          prerelease: true
          files: skock-windows.zip

      - name: Upload versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: skock-windows.zip
