[package]
name = "sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "skock-sim"
path = "src/main.rs"

[dependencies]
types = { path = "../types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
fixed = { version = "1", features = ["serde"] }
cordic = "0.1"
rand_xoshiro = "0.6"
rand_core = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
