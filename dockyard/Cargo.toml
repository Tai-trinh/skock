[package]
name = "dockyard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "skock-dockyard"
path = "src/main.rs"

[dependencies]
types = { path = "../types" }
catalog = { path = "../catalog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_xoshiro = "0.6"
rand_core = "0.6"
anyhow = "1"
